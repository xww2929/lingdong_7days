<style>
  :root{
    --bg:#0a0e14; --panel:#101620; --panel2:#151d2a; --line:#233046;
    --txt:#cfd8e3; --dim:#7d8b9d; --ice:#8fd0ff; --ice2:#5aa7d8;
    --warn:#ff9d76; --good:#8fe3a0; --gold:#ffd98a; --bad:#ff7a7a;

    --choicehover:#1a2436; --vig:rgba(2,5,10,.55);
  }
  body.t-hearth{
    --bg:#161009; --panel:#201710; --panel2:#2a1e13; --line:#4a3822;
    --txt:#ecdcc4; --dim:#a08a6c; --ice:#ffc98a; --ice2:#d8a05e;
    --gold:#ffe3a6; --warn:#ff9d76; --good:#a8e39a; --bad:#ff7a7a;
    --mainbg:rgba(32,23,16,.66); --hdrbg:rgba(22,16,9,.92);
    --choicehover:#332516; --vig:rgba(5,3,1,.55);
  }
  body.t-journal{
    --bg:#e9e0cd; --panel:#f2ead8; --panel2:#e6dccb; --line:#c4b391;
    --txt:#4a3f2d; --dim:#8a7a5c; --ice:#3e6e8f; --ice2:#5a8aa8;
    --gold:#a8742a; --warn:#c05a30; --good:#3e7a4a; --bad:#b03a3a;
    --mainbg:rgba(242,234,216,.82); --hdrbg:rgba(233,224,205,.94);
    --choicehover:#ddd0b4; --vig:rgba(120,100,70,.22);
  }
  body.t-term{
    --bg:#050b06; --panel:#081108; --panel2:#0b170c; --line:#1c3a1e;
    --txt:#b8e6b8; --dim:#5f8f62; --ice:#7ee387; --ice2:#4aa855;
    --gold:#d8ffa0; --warn:#ffb37a; --good:#7ee387; --bad:#ff8a8a;
    --mainbg:rgba(8,17,8,.72); --hdrbg:rgba(5,11,6,.92);
    --choicehover:#0e2410; --vig:rgba(0,4,0,.6);
  }
  body.t-blood{
    --bg:#120a0c; --panel:#1a0f11; --panel2:#241417; --line:#42232a;
    --txt:#e3cfd2; --dim:#9d7f85; --ice:#f0a8a8; --ice2:#c46a6a;
    --gold:#ffd98a; --warn:#ff9d76; --good:#9adfa8; --bad:#ff5a5a;
    --mainbg:rgba(26,15,17,.66); --hdrbg:rgba(18,10,12,.92);
    --choicehover:#2e181c; --vig:rgba(8,3,4,.55);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.75; overflow-x:hidden;
  }
  #snow{position:fixed; inset:0; pointer-events:none; z-index:50;}
  #vignette{position:fixed; inset:0; pointer-events:none; z-index:49;
    background:radial-gradient(ellipse at center, transparent 55%, var(--vig) 100%);}
  #app{max-width:680px; margin:0 auto; padding:12px 14px 60px; position:relative; z-index:5;}
  header{
    position:sticky; top:0; z-index:20; background:var(--hdrbg);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
    margin:-12px -14px 10px; padding:10px 16px 8px;
  }
  .hrow{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between;}
  .daytag{font-size:15px; letter-spacing:2px; color:var(--ice); font-weight:600;}
  .daytag b{color:var(--gold); font-weight:700;}
  .temp{font-size:13px; color:var(--dim);}
  .temp b{color:var(--ice); font-weight:600;}
  .money{font-size:15px; color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums;}
  .slotrow{display:flex; gap:6px; margin-top:6px;}
  .slotdot{flex:1; height:4px; border-radius:2px; background:var(--line);}
  .slotdot.on{background:var(--ice2);}
  .slotdot.now{background:var(--gold); box-shadow:0 0 8px rgba(255,217,138,.6);}
  #stats{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px;
  }
  .rgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px 10px;}
  .ritem{font-size:12.5px; color:var(--dim); white-space:nowrap;}
  .ritem b{color:var(--txt); font-weight:600; font-variant-numeric:tabular-nums;}
  .hstats{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:12px; color:var(--dim);}
  .hstats b{font-weight:600;}
  .storbar{height:5px; background:var(--line); border-radius:3px; margin-top:8px; overflow:hidden;}
  .storfill{height:100%; background:linear-gradient(90deg,var(--ice2),var(--ice)); border-radius:3px;}
  .storfill.danger{background:linear-gradient(90deg,#a04030,var(--warn));}
  #main{
    background:var(--mainbg); border:1px solid var(--line); border-radius:12px;
    padding:20px 20px 16px; min-height:280px;
  }
  .scenetitle{
    font-family:"Noto Serif SC","Songti SC",serif; color:var(--ice);
    font-size:17px; letter-spacing:3px; margin-bottom:12px; padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  #text{
    font-family:"Noto Serif SC","Songti SC",serif; font-size:15.5px; white-space:pre-line;
    min-height:150px; text-align:justify;
  }
  #text .fx-good{color:var(--good);} #text .fx-bad{color:var(--bad);}
  #text .fx-warn{color:var(--warn);} #text .fx-gold{color:var(--gold);} #text .fx-ice{color:var(--ice);}
  #choices{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .choice{
    text-align:left; background:var(--panel2); color:var(--txt);
    border:1px solid var(--line); border-radius:8px; padding:10px 14px;
    font-size:14.5px; cursor:pointer; transition:all .15s; font-family:inherit; line-height:1.5;
  }
  .choice:hover:not(:disabled){border-color:var(--ice2); background:var(--choicehover); transform:translateX(3px);}
  .choice:disabled{opacity:.38; cursor:not-allowed;}
  .choice .sub{display:block; font-size:12px; color:var(--dim); margin-top:2px;}
  .choice .price{color:var(--gold); font-variant-numeric:tabular-nums;}
  .choice .risen{color:var(--warn);}
  .divider{border:none; border-top:1px dashed var(--line); margin:4px 0;}
  #footer{margin-top:14px; text-align:center; font-size:12px; color:var(--dim);}
  #footer button{
    background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px;
    padding:4px 14px; cursor:pointer; font-size:12px; margin:0 6px;
  }
  .ending-wrap{text-align:center; padding:10px 0;}
  .ending-title{
    font-family:"Noto Serif SC","Songti SC",serif; font-size:26px; letter-spacing:8px;
    color:var(--gold); margin:18px 0 6px;
  }
  .ending-sub{color:var(--dim); font-size:13px; letter-spacing:2px; margin-bottom:18px;}
  .survive-big{font-size:52px; font-weight:700; color:var(--ice); font-variant-numeric:tabular-nums; line-height:1.2;}
  .survive-big small{font-size:16px; color:var(--dim); font-weight:400;}
  .rank{display:inline-block; border:1px solid var(--gold); color:var(--gold); border-radius:6px;
    padding:2px 18px; letter-spacing:6px; margin:10px 0 16px; font-size:15px;}
  .breakdown{
    text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; font-size:13px; margin:12px 0; color:var(--dim);
  }
  .breakdown b{color:var(--txt);}
  .ending-text{
    font-family:"Noto Serif SC","Songti SC",serif; text-align:justify; white-space:pre-line;
    font-size:15px; margin:14px 0;
  }
  .title-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:78vh; text-align:center;}
  .game-title{
    font-family:"Noto Serif SC","Songti SC",serif; font-size:42px; letter-spacing:14px;
    color:var(--ice); text-shadow:0 0 30px rgba(143,208,255,.35); margin-bottom:4px;
  }
  .game-subtitle{color:var(--dim); letter-spacing:6px; font-size:14px; margin-bottom:36px;}
  .start-btn{
    background:transparent; border:1px solid var(--ice2); color:var(--ice); font-family:inherit;
    font-size:16px; letter-spacing:8px; padding:12px 44px; border-radius:8px; cursor:pointer; transition:all .25s;
  }
  .start-btn:hover{background:rgba(143,208,255,.12); box-shadow:0 0 24px rgba(143,208,255,.25);}
  .hint{color:var(--dim); font-size:12px; margin-top:22px; letter-spacing:1px;}
  .blink{animation:blink 1.2s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .fadein{animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  #gearbtn{
    position:fixed; right:14px; bottom:14px; z-index:60;
    background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:20px; padding:6px 16px; font-size:12.5px; cursor:pointer;
    letter-spacing:2px; font-family:inherit;
  }
  #gearbtn:hover{color:var(--ice); border-color:var(--ice2);}
  #themepanel{
    position:fixed; right:14px; bottom:56px; z-index:61;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; width:190px; box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  #themepanel h4{font-size:13px; color:var(--dim); letter-spacing:3px; margin-bottom:10px; font-weight:400;}
  .themeopt{
    display:flex; align-items:center; gap:8px; width:100%;
    background:none; border:1px solid transparent; color:var(--txt);
    border-radius:7px; padding:6px 8px; font-size:13px; cursor:pointer; font-family:inherit;
    text-align:left; margin-bottom:2px;
  }
  .themeopt:hover{border-color:var(--line);}
  .themeopt.on{border-color:var(--gold); color:var(--gold);}
  .tdots{display:inline-flex; gap:3px;}
  .tdots i{width:9px; height:9px; border-radius:50%; display:inline-block;}
  #charov{
    position:fixed; inset:0; z-index:55; display:none;
    background:var(--vig); backdrop-filter:blur(3px);
    overflow-y:auto; padding:30px 14px;
  }
  .charbox{
    max-width:560px; margin:0 auto; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:18px 18px 14px;
  }
  .charhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .chartitle{font-family:"Noto Serif SC","Songti SC",serif; font-size:19px; letter-spacing:4px; color:var(--ice);}
  .charclose{
    background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px;
    padding:3px 12px; cursor:pointer; font-size:12px; font-family:inherit;
  }
  .charclose:hover{color:var(--bad); border-color:var(--bad);}
  .ctabs{display:flex; gap:8px; margin-bottom:14px;}
  .ctab{
    flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--dim);
    border-radius:8px; padding:7px 0; font-size:14px; cursor:pointer; font-family:inherit; letter-spacing:3px;
  }
  .ctab.on{color:var(--gold); border-color:var(--gold);}
  .chip{
    display:inline-block; border:1px solid var(--line); color:var(--txt);
    border-radius:14px; padding:2px 12px; font-size:12.5px; margin:2px 4px 2px 0;
  }
  .chip.got{color:var(--gold); border-color:var(--gold);}
  .chip.lock{color:var(--dim); opacity:.55;}
  .rescard{
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:8px;
  }
  .rescard .rname{font-size:14px; color:var(--txt);}
  .rescard .rname b{color:var(--gold); font-variant-numeric:tabular-nums;}
  .rescard .rdesc{font-size:12px; color:var(--dim); margin-top:3px; line-height:1.6;}
  .oslot{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1px dashed var(--line); padding:7px 2px; font-size:14px;
  }
  .oslot .oname{color:var(--dim); font-size:12.5px; letter-spacing:2px;}
  .oslot .oval{color:var(--txt); font-family:"Noto Serif SC","Songti SC",serif;}
  .otier{
    text-align:center; border:1px solid var(--gold); color:var(--gold); border-radius:8px;
    padding:5px 0; letter-spacing:5px; font-size:14px; margin-bottom:12px;
    font-family:"Noto Serif SC","Songti SC",serif;
  }
  .odesc{font-size:12.5px; color:var(--dim); text-align:center; margin:10px 0 4px; line-height:1.7;}
  @media (max-width:480px){
    .rgrid{grid-template-columns:repeat(3,1fr);}
    #main{padding:14px;}
    .game-title{font-size:32px; letter-spacing:9px;}
  }
</style>
</head>

function scene(title,text,choices){
  if(typeof choices==="string"){ text=text+"\n\n"+choices; choices=[]; }
  if(!Array.isArray(choices)) choices=[];
  choices=choices.filter(function(c){return c&&typeof c==="object"&&typeof c.t==="string"&&typeof c.fn==="function";});
  if(choices.length===0&&arguments.length>=3){ choices=[{t:"继续",fn:function(){nextSlot();}}]; }
  var m=document.getElementById("main");
  var ch="";
  for(var i=0;i<choices.length;i++){
    var c=choices[i];
    var dis=c.disabled?"disabled":"";
    var sub=c.sub?'<span class="sub">'+c.sub+"</span>":"";
    ch+='<button class="choice fadein" data-i="'+i+'" '+dis+">"+c.t+sub+"</button>";
  }
  m.innerHTML=(title?'<div class="scenetitle">'+title+"</div>":"")+
    '<div id="text"></div><div id="choices" style="display:none">'+ch+"</div>";
  CURRENT_TEXT=text;
  var btns=m.querySelectorAll(".choice");
  for(var j=0;j<btns.length;j++){
    (function(b){b.onclick=function(){ if(b.disabled)return; stopType(); document.getElementById("text").innerHTML=colorize(CURRENT_TEXT); revealChoices(); choices[parseInt(b.getAttribute("data-i"),10)].fn(); };})(btns[j]);
  }
  startType(text);
  renderStats(); save();
}

}
function startType(text){
  stopType();

function gainRes(effects,mult){
  var lines=[], cap=capacity();
  for(var k in effects){
    var want=Math.round(effects[k]*(mult||1));
    if(want<=0)continue;
    var room=cap-resSum();
    var got=Math.min(want,Math.max(0,room));
    if(got>0){S.res[k]+=got; lines.push(k==="food"||k==="water"?({food:"食物",water:"饮水"})[k]+" +"+got+"天":({warmth:"保暖",fuel:"燃料",meds:"药品",hygiene:"卫生",tools:"器械",barter:"硬通货"})[k]+" +"+got);}
    if(got<want) lines.push("仓储已满,"+({food:"食物",water:"饮水",warmth:"保暖",fuel:"燃料",meds:"药品",hygiene:"卫生",tools:"器械",barter:"硬通货"})[k]+"有 "+(want-got)+" 装不下了");
  }
  return lines;
}

function nextSlot(){
  S.slot++;
  if(S.slot>3){ endOfDay(); return; }
  var beat=storyBeat();
  if(beat){ beat(); }
  else showMap();
}

function endOfDay(){
  S.fatigue=Math.max(0,S.fatigue-18);
  if(S.day>=7){ finale(); return; }
  S.day++; S.slot=0; S.visitedToday={};
  scene("第 "+(S.day-1)+" 天 · 深夜", NEWS[S.day-2]+"\n\n你清点着屋子里的物资,在清单上打勾。窗外,风声比昨天更急了。\n\n(疲劳已部分恢复)",[{t:"第 "+S.day+" 天,还有 "+(8-S.day)+" 天",fn:function(){ var b=storyBeat(); if(b)b(); else showMap(); }}]);
}

function shopScene(id,desc,buyCount){
  var L=LOCS[id];
  var lines=[];
  if(buyCount>0)lines.push(desc2After(id));
  var avail=BUNDLES.filter(function(b){return b.loc===id&&S.day>=b.minD&&S.day<=b.maxD;});
  var limit=S.day>=5&&(id==="market"||id==="wholesale")?1:99;
  var soldOut=BUNDLES.filter(function(b){return b.loc===id&&(S.day>b.maxD);});
  var choices=[];
  var anyAvail=false;
  for(var i=0;i<avail.length;i++){
    (function(b){
      var p=priceOf(b);
      var mult=1;
      if(S.hasCar&&b.car)mult=1.25;
      if(S.fatigue>=85)mult*=0.7;
      var effTxt=[];
      var names={food:"食物",water:"饮水",warmth:"保暖",fuel:"燃料",meds:"药品",hygiene:"卫生",tools:"器械",barter:"硬通货"};
      for(var k in b.res){
        var v=Math.round(b.res[k]*mult);
        effTxt.push(names[k]+"+"+v+(k==="food"||k==="water"?"天":""));
      }
      var dis=buyCount>=limit||S.money<p;
      choices.push({t:b.name+"<span class=\"price\"> "+fmt(p)+"</span>"+(PRICE[S.day-1]>1.3?' <span class="risen">涨</span>':""),
        sub:b.desc+" · "+effTxt.join(", ")+(limit===1&&buyCount>=1?" · [限购]":"")+(dis&&S.money<p?" · 现金不足":""),
        disabled:dis,
        fn:function(){ doBuy(b,p,mult,id,desc,buyCount); }});
      if(!dis)anyAvail=true;
    })(avail[i]);
  }
  if(avail.length===0) lines.push("货架上空空如也,只剩价签在冷风里晃。");
  if(soldOut.length>0) lines.push("老板摊手:「"+soldOut[0].name+"?三天前就没了。」");
  if(limit===1&&buyCount>=1) lines.push("限购令下,这家店今天不能再买了。");
  choices.push({t:"离开",fn:function(){ randomEventThen(id); }});
  scene(LOCS[id].name,desc+"\n\n"+lines.join("\n"),choices);
}

function desc2After(id){

function doBuy(b,p,mult,locId,desc,buyCount){
  S.money-=p;
  var lines=gainRes(b.res,mult);
  S.expo=clamp(S.expo+LOCS[locId].expo,0,100);
  S.fatigue=clamp(S.fatigue+4,0,100);
  var extra="";
  if(locId==="black"&&Math.random()<0.18){
    var ks=[]; for(var k in b.res)ks.push(k);
    var rk=ks[Math.floor(Math.random()*ks.length)];
    var lost=Math.round(S.res[rk]*0.3);
    S.res[rk]-=lost;
    extra="\n\n回到家清点时你才发现,黑市的货短了三成。找谁说理去。("+({food:"食物",water:"饮水",warmth:"保暖",fuel:"燃料",meds:"药品",hygiene:"卫生",tools:"器械",barter:"硬通货"})[rk]+" -"+lost+")";
  }
  if(locId==="wholesale"&&S.day>=4&&(b.id==="whs_salt"||b.id==="whs_liq")&&Math.random()<0.15){
    S.res.barter=Math.ceil(S.res.barter/2);
    extra="\n\n后来你尝了一口——盐是苦的,假货。整箱都是。";
  }
  var canContinue=!(S.day>=5&&(locId==="market"||locId==="wholesale"));
  var after=[
    canContinue?{t:"继续采购",fn:function(){shopScene(locId,desc,buyCount+1);}}:null,
    {t:"离开",fn:function(){randomEventThen(locId);}}
  ].filter(Boolean);
  scene(LOCS[locId].name,"付款成功。"+fmt(p)+"\n\n"+lines.join(" · ")+extra,after);
}

function randomEventThen(locId){
  var pool=RANDOM_EVENTS.filter(function(e){return !e.cond||e.cond(locId);});
  if(pool.length>0&&Math.random()<0.42){
    var ev=pool[Math.floor(Math.random()*pool.length)];
    ev.fn();
  } else nextSlot();
}

function takeRes(amount){
  var names={food:"食物",water:"饮水",warmth:"保暖",fuel:"燃料",meds:"药品",hygiene:"卫生",tools:"器械",barter:"硬通货"};

  var ratio=Math.min(0.9,amount/total);

}

function startNight(){
  S.night={i:0,hunger:0,thirst:0,frost:0,sick:0,flags:{}};
  scene("长夜 · 降临","第七天的午夜过去了。你没有死。\n\n这就已经赢了前世的你——但长夜,才刚刚开始。\n\n残存的广播说,这场雪至少还要下两个月。\n\n从今往后:每天吃掉一份食物、喝掉一份水、烧掉一份燃料。饥饿到 7、断水到 4、冻伤到 6、重病到 6——任何一条触线,就是终点。\n\n每个阶段你只能做一件事:化雪取水、冒险搜刮、以物易物、拆家具烧火、静养、守夜戒备。\n\n活到第六十天,雪会停。",[
    {t:"开始熬冬",fn:nightCheckpoint}
  ]);
}

function nightConsume(i){
  var n=S.night;
  if(n.flags["c"+i])return;
  n.flags["c"+i]=1;
  if(i===0)return;
  var d=NIGHT_DAYS[i]-NIGHT_DAYS[i-1];
  var fm=S.familyFlag?1.3:1;
  var fNeed=Math.ceil(d*fm),wNeed=Math.ceil(d*fm),fuNeed=d;
  if(S.res.food>=fNeed){S.res.food-=fNeed;n.hunger=Math.max(0,n.hunger-Math.ceil(d/2));}
  else{n.hunger+=fNeed-S.res.food;S.res.food=0;}
  if(S.res.water>=wNeed){S.res.water-=wNeed;n.thirst=Math.max(0,n.thirst-Math.ceil(d/2));}
  else{n.thirst+=wNeed-S.res.water;S.res.water=0;}
  if(S.res.fuel>=fuNeed){S.res.fuel-=fuNeed;n.frost=Math.max(0,n.frost-1);}
  else{var def=fuNeed-S.res.fuel;var rate=S.res.warmth>=45?0.5:1;S.res.fuel=0;n.frost+=Math.ceil(def*rate);}
}

function nightCheckpoint(){
  var n=S.night,i=n.i;
  nightConsume(i);
  if(n.hunger>=7)return nightDeath("hunger");
  if(n.thirst>=4)return nightDeath("thirst");
  if(n.frost>=6)return nightDeath("frost");
  if(n.sick>=6)return nightDeath("sick");
  if(NIGHT_DAYS[i]>=60)return springEnding();
  var ev=NIGHT_EVENTS[i];
  if(ev&&!n.flags["e"+i]){n.flags["e"+i]=1;ev();}
  else nightActions();
}

function nightStatusText(){
  var n=S.night,day=NIGHT_DAYS[n.i];
  var s="末世第 "+day+" 天 · 室外 "+NIGHT_TEMP[day]+"°C。\n\n";
  s+="【存粮】食物 "+S.res.food+" 天 · 饮水 "+S.res.water+" 天 · 燃料 "+S.res.fuel+" · 药品 "+S.res.meds+" · 硬通货 "+S.res.barter+"\n";
  s+="【状态】饥饿 "+n.hunger+"/7 · 缺水 "+n.thirst+"/4 · 冻伤 "+n.frost+"/6 · 病 "+n.sick+"/6 · 防御 "+S.defense+"\n\n";
  s+="选择这个阶段的生存行动(只能选一个):";
  return s;
}

function nightActions(){
  var choices=[];
  for(var i=0;i<NIGHT_ACTS.length;i++){
    (function(a){choices.push({t:a.name,sub:a.sub,disabled:!a.can(),fn:a.fn});})(NIGHT_ACTS[i]);
  }
  scene("长夜 · 抉择",nightStatusText(),choices);
}

function nightDeath(cause){

  var m={
    hunger:{title:"苦冬",text:"第 "+day+" 天,锅彻底空了。\n\n你把最后一把米熬成粥的那天,还留着半碗,想留给明天。\n\n饥饿是缓慢的死法:先是饿,然后是冷,然后是困。\n\n你死在了和前世同一个地方——差一点,就差那么一点。\n\n【启示:食物要囤到开春,不是囤到心安。】"},
    thirst:{title:"渴",text:"满世界都是水——雪堆到了窗台。但没有燃料,雪只是雪。\n\n你舔着窗上的冰花,想起超市里那些九块钱一箱的矿泉水。\n\n第 "+day+" 天,你死于脱水,守着一座水的坟墓。\n\n【启示:水比食物致命,而燃料就是水——记得化雪。】"},
    frost:{title:"冻毙长夜",text:"第 "+day+" 天,炉火最后一次熄灭。\n\n你裹着所有能裹的东西,缩成前世那个熟悉的姿势。\n\n冻死其实是温柔的:先是痛,然后是困,然后,就什么都不重要了。\n\n【启示:燃料要撑六十天——拆家具、做交易、抢空投,一样别放过。】"},
    sick:{title:"病榻",text:"一场感冒,在没有医院的世界里,就是绝症。\n\n第 "+day+" 天,你在滚烫的幻觉里,又回到了末日前第七天的早晨——如果重来一次,药房的门,你还推得开吗?\n\n【启示:病到 3 就该用药;药品和静养,总得备一样。】"},
    robbed:{title:"怀璧其罪",text:"他们来了,而且不止是抢。\n\n你囤积的消息在楼里传了太多天,你的门,没能挡住人心。\n\n第 "+day+" 天,物资、尊严,连同「粮仓」的传说,一起被埋进雪里。\n\n前世死于天灾,这一世,死于人祸。\n\n【启示:显眼度是隐形的债。藏货、加固、结盟,一样都不能少。】"}
  }[cause];

function springEnding(){
  var title,text,rank;
  if(S.defense>=40&&S.expo<=45){
    rank="S";title="凛冬之王";
    text="第六十天清晨,雪停了。\n\n你的单元楼,是这片城区最后一盏亮着的灯。老陈守门,煤球放哨,张伟管分配,盐和糖在你手里流转,换来了药品、弹药,和一个缩在防风墙里的小小社区。\n\n军队的破冰车碾开街道时,登记员问你是做什么的。\n\n你想了想,说:「一个提前七天知道冬天会来的人。」\n\n【凛冬之王:囤货、隐蔽、防御、人心——满分答卷,亲手写完。】";
  } else if(S.karma>=45){
    rank="S";title="火种";
    text="第六十天,雪停了。你家客厅的「以物易物点」还开着。\n\n收银姑娘一家、分到罐头的孕妇、你帮过的每一张脸,在长夜里连成一张网,把整个单元楼兜住了。\n\n统计员写下:该楼幸存率,全区第一。你说是运气,他们不信。\n\n「囤货靠清醒,活下来靠人心。」\n\n【火种:物资够用,善意盈余。】";
  } else if(S.familyFlag||S.trust>=60){
    rank="A";title="相依为命";
    text=S.familyFlag?
    "一家人挤在主卧改的堡垒里,熬过了每一顿按克分配的饭。\n\n第六十天,妈妈掀开窗板看了看天:「儿子,雪停了,妈给你擀面。」\n\n前世那个没能接起的电话,这一世,变成了餐桌上热气腾腾的一副碗筷。\n\n【相依为命:你护住了最想护住的人。】":
    "开春,你踩着没膝的积雪,走了八百里回家。\n\n推开门,炉火正旺——你爸钉的窗板、你妈囤的腊肉、你电话里一句句的叮嘱,都活着。\n\n你妈头也没抬:「洗手,吃饭。」\n\n【相依为命:隔着八百里风雪,你护住了一整个家。】";
  } else if(S.neighbor>=55){
    rank="A";title="远亲不如近邻";
    text="第六十天,王婶端着一屉热包子来敲门——用你换给她的那袋盐发的面。\n\n三户人家并成了一个家:你出物资,王婶管伙食,老陈管安全。盘点时你发现,分享在末世里不是减法,是除法。\n\n【远亲不如近邻:你的盐,没有白给。】";
  } else {
    rank="A";title="孤独的幸存者";
    text="你活到了第六十天,以一种精密如钟表的方式。\n\n按时吃饭,按量烧煤,台账精确到克。雪最大的时候,你发现自己已经很多天没说过一句话。\n\n你对着空荡的客厅喊了一声「妈——」,没有回答。\n\n你赢了这场冬天。只是赢得,有点安静。\n\n【孤独的幸存者:活着的代价,是活着本身。】";
  }

  S.ending={title:title,text:text,survive:survive,rank:rank,sub:"熬过整个寒冬 · 第六十天,雪停了"};

function restart(){
  if(!confirm("确定放弃当前进度,重新开始七天?"))return;
  wipe(); S=newGame(); startGame(true);
}

function applyTheme(id){

  for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===(id||""))SNOW_COLOR=THEMES[i].snow;

function buildThemePanel(){
  var p=document.getElementById("themepanel");

  for(var i=0;i<THEMES.length;i++){

    h+='<button class="themeopt'+(CUR_THEME===t.id?" on":"")+'" onclick="applyTheme(\''+t.id+'\')">'+
       '<span class="tdots">'+t.dots.map(function(c){return '<i style="background:'+c+'"></i>';}).join("")+'</span>'+t.name+'</button>';
  }
  h+='<div style="font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:1px">选择自动保存,雪花颜色随主题变化</div>';
  p.innerHTML=h;
}
function initTheme(){
  var saved="";
  try{saved=localStorage.getItem("rebirth7_theme")||"";}catch(e){}

    var p=document.getElementById("themepanel");
    p.style.display=p.style.display==="none"?"block":"none";

}

function getOutfit(){
  var w=S.res.warmth;
  var tier=w>=45?3:w>=30?2:w>=15?1:0;
  var names=["初来乍到","入冬装束","严冬装束","极寒战装"];
  var heads=["无","毛线帽","护耳棉帽","军用极寒帽"];
  var tops=["旧外套","加绒卫衣","加厚羽绒服","军大衣加极地内胆"];
  var bots=["单裤","秋裤加外裤","防风棉裤","军用雪地裤"];
  var shoes=["旧运动鞋","徒步鞋","雪地靴","极地靴"];
  var flavors=["这一身过冬,有点悬。","像模像样的过冬打扮。","零下二十度也敢出门了。","这一身,能扛到零下四十度。"];
  var acc=[],o=S.outfit||{};
  if(o.scarf)acc.push("王婶的旧围巾");
  if(S.chen)acc.push("老陈的军手套");
  if(S.res.tools>=10)acc.push("磨亮的钢管");
  if(o.goggles)acc.push("军用护目镜");
  if(S.dog)acc.push("煤球的牵引绳");
  if(S.defense>=50)acc.push("退伍纪念徽章");
  return {tier:tier,name:names[tier],head:heads[tier],top:tops[tier],bottom:bots[tier],shoe:shoes[tier],flavor:flavors[tier],acc:acc};
}

function getSignature(){
  if(S.night){
    if(S.defense>=45)return "这栋楼里最不好惹的人";
    if(S.night.hunger>=4||S.res.food<10)return "勒紧裤腰带的幸存者";
    return "精打细算的熬冬者";
  }
  if(S.expo>=60)return "楼里人尽皆知的「大户」";
  if(S.res.barter>=25)return "邻居口中的「百货商人」";
  if(S.defense>=40)return "深藏不露的硬茬";
  return "一个提前知道冬天会来的普通人";
}

  var ah="";
  for(var i=0;i<allies.length;i++)ah+='<span class="chip'+(allies[i][1]?" got":" lock")+'">'+(allies[i][1]?allies[i][0]:"未解锁")+'</span>';
  h+='<div class="rescard"><div class="rname" style="font-size:13px;color:var(--dim);letter-spacing:2px">同行者与家底</div><div style="margin-top:4px">'+ah+'</div></div>';
  var got=endingsMeta(),eh="";
  for(var j=0;j<ALL_ENDINGS.length;j++)eh+='<span class="chip'+(got.indexOf(ALL_ENDINGS[j])>=0?" got":" lock")+'">'+(got.indexOf(ALL_ENDINGS[j])>=0?ALL_ENDINGS[j]:"？？？")+'</span>';
  h+='<div class="rescard"><div class="rname" style="font-size:13px;color:var(--dim);letter-spacing:2px">已解锁结局 '+got.length+' / '+ALL_ENDINGS.length+'</div><div style="margin-top:4px">'+eh+'</div>'+
     '<div class="rdesc">结局收集跨周目保存在本机,解锁全部结局即是通关认证。</div></div>';
  return h;
}
function charRes(){
  var h="";
  for(var i=0;i<RES_DEF.length;i++){
    var k=RES_DEF[i][0],nm=RES_DEF[i][1],v=S.res[k];
    var pct=Math.min(100,Math.round(v/capacity()*100));
    h+='<div class="rescard"><div class="rname">'+nm+' <b>'+v+'</b>'+
       '<span style="float:right;color:var(--dim);font-size:12px">占仓储 '+pct+'%</span></div>'+
       '<div class="storbar"><div class="storfill'+(pct>=85?" danger":"")+'" style="width:'+pct+'%"></div></div>'+
       '<div class="rdesc">'+RES_DESC[k]+'</div></div>';
  }
  return h;
}
function charOutfit(){
  var o=getOutfit();
  var rows=[["头部",o.head],["上身",o.top],["下身",o.bottom],["鞋履",o.shoe]];
  var h='<div class="otier">'+o.name+'</div>';
  for(var i=0;i<rows.length;i++){
    h+='<div class="oslot"><span class="oname">'+rows[i][0]+'</span><span class="oval">'+rows[i][1]+'</span></div>';
  }
  var acc=o.acc.length?o.acc.join(" · "):"暂无";
  h+='<div class="oslot"><span class="oname">随身</span><span class="oval" style="font-size:13px">'+acc+'</span></div>';
  h+='<div class="odesc">'+o.flavor+'<br>装扮随保暖值自动升级;部分随身物件来自剧情遭遇,收集它们也是活着的样子。</div>';
  return h;
}

function titleScreen(){
  var m=document.getElementById("main");
  m.innerHTML='<div class="title-screen">'+
    '<div class="game-title">重生七日</div>'+
    '<div class="game-subtitle">凛 冬 将 至</div>'+
    '<div class="hint" style="margin-top:-26px;margin-bottom:10px">已解锁结局 '+endingsMeta().length+' / '+ALL_ENDINGS.length+'</div>'+
    '<button class="start-btn" id="btn-start">开始七天</button>'+
    '<div class="hint blink">末日重生囤货生存 · 含长夜熬冬篇 · v1.3</div>'+
    (hasSave()?'<button class="start-btn" style="margin-top:14px;letter-spacing:4px;font-size:13px;padding:8px 26px;border-color:var(--line);color:var(--dim)" id="btn-continue">继续上次</button>':"")+
    '<div class="hint" style="max-width:420px;line-height:2">你重生回到了末日前第7天。<br>极寒长夜将于 11 月 19 日降临。<br>囤积物资,藏好自己,护住想护住的人。</div>'+
    '</div>';
  document.getElementById("btn-start").onclick=function(){wipe();S=newGame();startGame(true);};
  var c=document.getElementById("btn-continue");
  if(c)c.onclick=function(){S=load();startGame(false);};
  document.getElementById("hdr").style.display="none";
  document.getElementById("stats").style.display="none";
  document.getElementById("footer").style.display="none";
}
function hasSave(){try{return !!localStorage.getItem("rebirth7_save");}catch(e){return false;}}

function startGame(fresh){
  S.outfit=S.outfit||{};
  document.getElementById("hdr").style.display="block";
  document.getElementById("footer").style.display="block";
  if(S.ending){showEnding();return;}
  if(fresh){
    scene("序 · 前世","末世第23天。零下四十一度。\n\n你蜷在结了冰的出租屋里,裹着家里所有的衣服,呼出的白气在眉毛上凝霜。胃里那点最后一包方便面的幻觉早就消化完了。\n\n手机早就没电了。它黑屏前的最后一个未接来电,是三天前,你妈打来的。\n\n意识涣散的最后一刻,你想:如果再来一次……\n\n——你猛地睁开眼。\n\n天花板。吊灯。墙上的挂历。\n\n手机在床头柜上嗡嗡震动,屏幕亮起:\n\n【11月12日 星期五】\n\n距离「长夜」,还有七天。",[
      {t:"这一世,我要活下去",fn:function(){nextSlot();}}
    ]);
  } else {
    if(S.night){nightCheckpoint();return;}
    var b=storyBeat(); if(b)b(); else showMap();
  }
}

(function snow(){
  var cv=document.getElementById("snow"),ctx=cv.getContext("2d");
  var W,H,flakes=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener("resize",resize);resize();
  for(var i=0;i<60;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.6,s:Math.random()*0.8+0.3,w:Math.random()*1.2-0.6,o:Math.random()*0.5+0.2});
  function tick(){
    ctx.clearRect(0,0,W,H);
    var intensity=S&&S.day>=5?1.8:1;
    ctx.fillStyle=SNOW_COLOR;
    for(var i=0;i<flakes.length;i++){
      var f=flakes[i];
      f.y+=f.s*intensity; f.x+=f.w*intensity+Math.sin(f.y/40)*0.3;
      if(f.y>H){f.y=-5;f.x=Math.random()*W;}
      if(f.x>W)f.x=0; if(f.x<0)f.x=W;
      ctx.globalAlpha=f.o;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(tick);
  }
  tick();
})();

document.getElementById("btn-restart").onclick=restart;
document.getElementById("btn-char").onclick=function(){if(S)showChar();};
initTheme();
titleScreen();
</script>
